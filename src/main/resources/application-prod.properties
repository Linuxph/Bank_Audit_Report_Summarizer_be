# ── Production profile ─────────────────────────────────────────────────────
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All values are injected by Render.com (or any other host) as env vars.

spring.application.name=bars

# ── Server port — CRITICAL for Render ─────────────────────────────────────
# Render injects $PORT dynamically. Spring MUST bind to it or you get
# ROUTER_EXTERNAL_TARGET_ERROR. Fallback 8080 is for local testing only.
server.port=${PORT:8080}

# MongoDB Atlas URI — Render env var key is MONGO_URI
# SPRING_DATA_MONGODB_URI is the Spring-native env override as a backup.
# Either name set in Render dashboard will work.
spring.data.mongodb.uri=${MONGO_URI:${SPRING_DATA_MONGODB_URI:MISSING_MONGO_URI}}

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Python AI service — set to your Render AI service URL
analysis.python.base-url=${AI_SERVICE_URL:http://localhost:8000}

# Cloudinary
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.folder=${CLOUDINARY_FOLDER:bank-audit-reports}

# File storage (ephemeral on Render free tier — uploads won't persist across deploys)
storage.local-dir=${STORAGE_LOCAL_DIR:uploads}

# Allow frontend origin for CORS (set to your Vercel URL)
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://localhost:5173}

# ── Logging — make MongoDB connection errors clearly visible ───────────────
logging.level.org.mongodb.driver=WARN
logging.level.org.springframework.data.mongodb=DEBUG
