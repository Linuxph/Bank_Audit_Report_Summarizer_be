# ── Production profile ─────────────────────────────────────────────────────
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All values are injected by Render.com (or any other host) as env vars.

spring.application.name=bars

# MongoDB Atlas URI — paste from Atlas dashboard
spring.data.mongodb.uri=${MONGO_URI}

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Python AI service — set to your Render AI service URL
analysis.python.base-url=${AI_SERVICE_URL}

# Cloudinary
cloudinary.url=${CLOUDINARY_URL}
cloudinary.folder=${CLOUDINARY_FOLDER:bank-audit-reports}

# File storage (ephemeral on Render free tier — uploads won't persist across deploys)
storage.local-dir=${STORAGE_LOCAL_DIR:uploads}

# Allow frontend origin for CORS (set to your Vercel URL)
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://localhost:5173}
