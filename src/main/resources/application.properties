spring.application.name=bars

# ── Database ──────────────────────────────────────────────────────────────────
# In production: set MONGO_URI env var to your MongoDB Atlas connection string
spring.data.mongodb.uri=${MONGO_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/test_db}}

# ── Security ──────────────────────────────────────────────────────────────────
security.jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3VyZUFuZEhTZTI1NktleUZvckJhcnNQcm9qZWN0MTIzNDU2Nzg5MA==}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Python AI service ─────────────────────────────────────────────────────────
analysis.python.base-url=${AI_SERVICE_URL:http://localhost:8000}

# ── Cloudinary ────────────────────────────────────────────────────────────────
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.folder=${CLOUDINARY_FOLDER:bank-audit-reports}

# ── File storage ──────────────────────────────────────────────────────────────
storage.local-dir=${STORAGE_LOCAL_DIR:uploads}

# ── CORS ──────────────────────────────────────────────────────────────────────
# In production: set ALLOWED_ORIGINS to your Vercel frontend URL
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
